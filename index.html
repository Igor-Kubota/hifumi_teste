<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="sources/icon_hifumi.png">
    <title>Aigas | Home </title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
</head>
<body>

    <!-- playsinline: necessário no iOS/Safari e alguns Android para autoplay funcionar -->
    <video autoplay muted loop playsinline id="bg-video">
        <source id="video-source" src="" type="">
        Seu navegador não suporta tags de vídeo HTML5.
    </video>



    <nav class="side-menu">
        <button class="menu-btn" id="menu-btn-1">Start</button>
        <button class="menu-btn" id="menu-btn-2">Title</button>
        <button class="menu-btn" id="menu-btn-3">Gallery</button>
        <button class="menu-btn" id="menu-btn-4">Contact</button>
    </nav>

    <audio id="bg-audio" loop>
        <source id="audio-source" src="" type="">
        Seu navegador não suporta tags de áudio HTML5.
    </audio>

    <div class="overlay">
        <div class="audio-control">
            <button id="toggle-audio-btn">🔊</button>
            <span id="audio-label">Áudio ligado</span>
        </div>
    </div>


    <div id="debug-msg"></div>

    <script src="script.js"></script>

</body>
</html>
